<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zombie Survival</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="scene">
      <div class="sky-glow"></div>
      <div class="moon"></div>
      <div class="mist mist-one"></div>
      <div class="mist mist-two"></div>
      <div class="mist mist-three"></div>

      <div id="zombies" aria-label="Animated zombie survivors"></div>

      <div class="ground">
        <div class="ground-line"></div>
      </div>

      <div class="hud">
        <div class="tag">LAST LIGHT</div>
        <div class="title">SURVIVAL<br />RUN</div>
        <div class="status">
          <span>ZONE</span>
          <strong>03</strong>
        </div>
      </div>

      <div class="reticle" aria-hidden="true">
        <span class="ring ring-1"></span>
        <span class="ring ring-2"></span>
        <span class="dot"></span>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
